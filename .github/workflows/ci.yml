name: Java CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scholarai_test
          POSTGRES_USER: scholarai_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify H2
        if: matrix.database == 'h2'
        run: mvn -B verify
      - name: Verify PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/scholarai_test
          TEST_DATABASE_USER: scholarai_test
          TEST_DATABASE_PASSWORD: test-only-password
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.database }}
          path: target/surefire-reports

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t scholarai:ci .
      - name: Smoke test packaged image
        run: |
          docker run -d --name scholarai-smoke -p 8080:8080 scholarai:ci
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs scholarai-smoke
          exit 1
      - name: Container logs
        if: always()
        run: docker logs scholarai-smoke || true
