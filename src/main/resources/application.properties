spring.application.name=ScholarAI
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/scholarai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4500KB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.scholarships.sync-enabled=${SCHOLARSHIP_SYNC_ENABLED:true}
app.scholarships.refresh-delay-ms=${SCHOLARSHIP_REFRESH_DELAY_MS:21600000}
app.scholarships.initial-delay-ms=${SCHOLARSHIP_INITIAL_DELAY_MS:1500}
app.cron-secret=${CRON_SECRET:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
