spring.application.name=ScholarAI
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/scholarai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail-from=${MAIL_FROM:noreply@localhost}
app.storage=${DOCUMENT_STORAGE:./data/documents}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
