<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head}"></head>
  <body>
    <header th:replace="~{layout :: header}"></header>
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main id="main-content" tabindex="-1" class="container">
      <div th:replace="~{layout :: heading}"></div>
      <div class="grid three">
        <section class="panel">
          <p class="eyebrow">REGISTERED USERS</p>
          <p class="score" th:text="${users.size()}"></p>
        </section>
        <section class="panel">
          <p class="eyebrow">APPLICATIONS</p>
          <p class="score" th:text="${applicationCount}"></p>
        </section>
        <section class="panel">
          <p class="eyebrow">MODEL GOVERNANCE</p>
          <h2>Fixed weights.<br />Auditable actions.</h2>
        </section>
      </div>
      <section class="section">
        <h2>User management</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${users}">
                <td>
                  <strong th:text="${u.name}"></strong>
                  <p th:text="${u.email}"></p>
                </td>
                <td th:text="${u.role}"></td>
                <td
                  th:text="${u.disabled ? 'Disabled' : (u.approved ? 'Approved' : 'Pending approval')}"
                ></td>
                <td>
                  <form
                    th:if="${u.id != user.id}"
                    th:action="@{/dashboard/admin/users/{id}(id=${u.id})}"
                    method="post"
                  >
                    <button
                      class="secondary"
                      name="action"
                      value="approve"
                      th:if="${!u.approved}"
                    >
                      Approve</button
                    ><button
                      class="secondary"
                      name="action"
                      th:value="${u.disabled ? 'enable' : 'disable'}"
                      th:text="${u.disabled ? 'Enable' : 'Disable'}"
                    ></button>
                  </form>
                  <form
                    th:if="${u.id != user.id}"
                    th:action="@{/dashboard/admin/users/{id}(id=${u.id})}"
                    method="post"
                  >
                    <label
                      >Change role<select name="action">
                        <option
                          value="role:student"
                          th:selected="${u.role == 'student'}"
                        >
                          Student
                        </option>
                        <option
                          value="role:institution"
                          th:selected="${u.role == 'institution'}"
                        >
                          Institution (approval required)
                        </option>
                        <option
                          value="role:admin"
                          th:selected="${u.role == 'admin'}"
                        >
                          Administrator
                        </option>
                      </select></label
                    ><button class="secondary">Update role</button>
                  </form>
                  <details th:if="${u.role == 'student'}">
                    <summary>Assess verified signals</summary>
                    <form
                      th:action="@{/dashboard/admin/users/{id}/assessment(id=${u.id})}"
                      method="post"
                    >
                      <label
                        >SOP quality / 100<input
                          name="sopQuality"
                          type="number"
                          min="0"
                          max="100"
                          step="1"
                          required
                      /></label>
                      <label
                        >Recommendation strength / 100<input
                          name="recommendationStrength"
                          type="number"
                          min="0"
                          max="100"
                          step="1"
                          required
                      /></label>
                      <label
                        >Conduct score / 100<input
                          name="behaviourScore"
                          type="number"
                          min="0"
                          max="100"
                          step="1"
                          required
                      /></label>
                      <label
                        >Evidence and assessment reason<textarea
                          name="reason"
                          required
                          minlength="10"
                          maxlength="2000"
                        ></textarea>
                      </label>
                      <button class="secondary">Record assessment</button>
                    </form>
                  </details>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Scoring weight registry</h2>
        <div class="row" th:each="c : ${components}">
          <span th:text="${c.label}"></span
          ><span
            th:text="${#numbers.formatDecimal(c.weight*100,1,0) + '%'}"
          ></span>
        </div>
      </section>
      <section class="section">
        <h2>Audit trail</h2>
        <label
          >Filter these events<input
            data-filter="audit"
            placeholder="Search actor, action, or record"
        /></label>
        <div class="table-wrap">
          <table id="audit">
            <thead>
              <tr>
                <th>When</th>
                <th>Actor</th>
                <th>Action</th>
                <th>Record</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${audit}">
                <td th:text="${a.created_at}"></td>
                <td th:text="${a.name}"></td>
                <td th:text="${a.action}"></td>
                <td th:text="${a.entity_id}"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="small">
          Most recent 200 events. No user passwords or document content are
          included.
        </p>
      </section>
    </main>
    <footer th:replace="~{layout :: footer}"></footer>
  </body>
</html>
